<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TypeRider — Un voyage de l'écriture</title>
  <meta name="description" content="Jeu de dactylographie en pixel art : tapez les mots qui tombent du ciel, faites évoluer votre véhicule de la trottinette au char, à travers 6 décors et 4 niveaux de difficulté, dont 2 pour les enfants.">
  <meta name="theme-color" content="#0a0e2a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TypeRider — Un voyage de l'écriture">
  <meta property="og:description" content="Jeu de dactylographie en pixel art : tapez les mots avant qu'ils touchent le sol. Gratuit, dans le navigateur, sur PC, Mac, iPhone et iPad.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- iPhone / iPad : « Sur l'écran d'accueil » ouvre le jeu en plein écran, comme une app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TypeRider">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <!-- scène pixel art (2D), sa version post-traitée (WebGL), puis l'interface nette au-dessus -->
  <canvas id="game"></canvas>
  <canvas id="vfx"></canvas>
  <canvas id="ui"></canvas>
  <!-- clavier tactile (téléphones et tablettes), sous la zone de jeu -->
  <canvas id="touchkb"></canvas>
  <script src="vehicles.js?v=12"></script>
  <script src="vfx.js?v=23"></script>
  <script src="game.js?v=26"></script>
  <script>
    // hors-ligne une fois installé sur l'écran d'accueil (seulement en ligne, pas en fichier local ni dans l'app de bureau)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/[?&]debug\b/.test(location.search)) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
