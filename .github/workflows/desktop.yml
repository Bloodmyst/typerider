# Construit TypeRider pour Windows et Mac, puis publie les fichiers dans une Release GitHub.
# Se déclenche à chaque tag de version (git tag v1.7.0 && git push origin v1.7.0),
# ou à la main depuis l'onglet Actions (dans ce cas : fichiers en artefacts, sans Release).
name: Applications de bureau

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Construction
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: typerider-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: TypeRider ${{ github.ref_name }}
          files: fichiers/*
          body: |
            **Windows** : `TypeRider-…-installateur.exe` (installe le jeu avec un raccourci)
            ou `TypeRider-…-portable.exe` (se lance directement, sans installation).
            Au premier lancement, Windows peut afficher « Windows a protégé votre ordinateur » :
            cliquez sur *Informations complémentaires*, puis *Exécuter quand même*.

            **Mac** : `…-mac-arm64.dmg` pour les Mac à puce Apple (M1 et suivants),
            `…-mac-x64.dmg` pour les Mac Intel. Glissez TypeRider dans Applications.
            Au premier lancement : clic droit sur l'app → *Ouvrir*, ou
            *Réglages Système → Confidentialité et sécurité → Ouvrir quand même*.
